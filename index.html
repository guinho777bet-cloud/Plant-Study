<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Study Tracker</title>
</head>
<body>
    <form class="inicio">
        <h1 id="capa">Study Tracker</h1><br>
        <label for="titulo">Digite o nome do estudo:</label><br>
        <input type="text" name="ftext" id="titulo"><br>

        <label for="ftime">Tempo estudado:</label><br>
        <input type="text" id="tempo" value="00:00" readonly><br>
        
        <input type="button" id="iniciar" value="Iniciar estudo">
        <input type="button" id="pausar" value="Pausar estudo">
        <input type="button" id="finalizar" value="Finalizar estudo">
        <input type="button" id="voltar" value="Voltar estudo"><br>

        <p id="tema"></p>
    </form>

    <script src="script.js"></script>
</body>
</html>
